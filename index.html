<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0c1116" />
  <meta name="color-scheme" content="dark" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ORDO" />

  <title>ORDO — A Rule of Life</title>

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230c1116'/%3E%3Ccircle cx='50' cy='50' r='31' fill='none' stroke='%23b7955c' stroke-width='5'/%3E%3Cpath d='M50 22v56M22 50h56' stroke='%23b7955c' stroke-width='3' opacity='.45'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23b7955c'/%3E%3C/svg%3E"
  />

  <style>
    :root {
      --bg: #0c1116;
      --bg-2: #10171e;
      --surface: #141c24;
      --surface-2: #19232d;
      --surface-3: #202c37;

      --text: #f1eee8;
      --muted: #9da5ad;
      --muted-2: #6e7882;

      --gold: #b7955c;
      --gold-light: #d0b27a;
      --gold-dark: #80663c;

      --green: #79a98b;
      --blue: #6f91ad;
      --red: #b8786f;
      --purple: #8e82aa;

      --border: rgba(255,255,255,.075);
      --border-strong: rgba(183,149,92,.30);

      --shadow: 0 18px 55px rgba(0,0,0,.28);
      --radius: 18px;
      --radius-sm: 12px;
      --nav-height: 78px;

      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -10%, rgba(183,149,92,.12), transparent 28rem),
        radial-gradient(circle at 100% 20%, rgba(80,105,125,.09), transparent 35rem),
        var(--bg);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
    }

    ::selection {
      color: #111;
      background: var(--gold-light);
    }

    .app-shell {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        max(14px, env(safe-area-inset-top))
        18px
        calc(var(--nav-height) + 42px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      margin: -14px -18px 20px;
      padding:
        max(14px, env(safe-area-inset-top))
        18px
        12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: linear-gradient(
        to bottom,
        rgba(12,17,22,.98),
        rgba(12,17,22,.90) 70%,
        rgba(12,17,22,0)
      );
      backdrop-filter: blur(16px);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--gold-light);
      background:
        linear-gradient(145deg, rgba(183,149,92,.12), transparent),
        var(--surface);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.025);
      font-family: var(--serif);
      font-size: 21px;
      letter-spacing: -.04em;
    }

    .brand {
      min-width: 0;
    }

    .brand-name {
      margin: 0;
      font-family: var(--serif);
      font-size: 20px;
      letter-spacing: .06em;
      line-height: 1;
    }

    .brand-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .13em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(20,28,36,.9);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .2s ease;
    }

    .icon-btn:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      stroke: var(--muted);
    }

    .page-head {
      margin: 12px 0 22px;
    }

    .eyebrow {
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 5px 0 5px;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(29px, 5vw, 44px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }

    .page-subtitle {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .motto {
      margin-top: 13px;
      color: var(--muted-2);
      font-family: var(--serif);
      font-size: 13px;
      font-style: italic;
      letter-spacing: .02em;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0,1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0,1fr));
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.018), transparent 60%),
        var(--surface);
      box-shadow: 0 6px 30px rgba(0,0,0,.12);
    }

    .card-pad {
      padding: 18px;
    }

    .card-gold {
      border-color: var(--border-strong);
      background:
        radial-gradient(circle at top right, rgba(183,149,92,.13), transparent 22rem),
        linear-gradient(145deg, rgba(255,255,255,.025), transparent 60%),
        var(--surface);
    }

    .card-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .kicker {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .card-title {
      margin: 0;
      color: var(--text);
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
      line-height: 1.2;
    }

    .card-copy {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .recommendation-title {
      margin: 3px 0 8px;
      max-width: 600px;
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(22px,4vw,30px);
      line-height: 1.18;
    }

    .recommendation-copy {
      max-width: 660px;
      margin: 0;
      color: #c0c5c9;
      font-size: 14px;
    }

    .gold-rule {
      width: 38px;
      height: 2px;
      margin: 14px 0;
      background: var(--gold);
      border-radius: 3px;
    }

    .progress-wrap {
      min-height: 100%;
      padding: 18px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .progress-ring {
      --p: 0;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle, var(--surface) 59%, transparent 60%),
        conic-gradient(var(--gold) calc(var(--p) * 1%), rgba(255,255,255,.065) 0);
      box-shadow:
        inset 0 0 0 1px var(--border),
        0 8px 35px rgba(0,0,0,.18);
    }

    .progress-ring strong {
      display: block;
      font-family: var(--serif);
      font-size: 27px;
      font-weight: 500;
      line-height: 1;
    }

    .progress-ring span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .progress-meta {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      margin-top: 22px;
    }

    .section-head {
      margin-bottom: 11px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 500;
      letter-spacing: -.015em;
    }

    .section-note {
      color: var(--muted);
      font-size: 12px;
    }

    .now-card {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .now-time {
      min-width: 68px;
      color: var(--gold-light);
      font-family: var(--serif);
      font-size: 19px;
    }

    .now-content {
      flex: 1;
      min-width: 0;
    }

    .now-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .now-title {
      margin-top: 2px;
      font-weight: 650;
    }

    .now-detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill,
    .category {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.025);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pill-gold {
      color: var(--gold-light);
      border-color: var(--border-strong);
      background: rgba(183,149,92,.08);
    }

    .pill-green {
      color: #a7ceb3;
      border-color: rgba(121,169,139,.25);
      background: rgba(121,169,139,.08);
    }

    .early-release {
      margin-top: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .toggle {
      position: relative;
      width: 50px;
      height: 28px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 99px;
      background: #303943;
      cursor: pointer;
      transition: .2s;
    }

    .toggle::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #d4d6d8;
      transition: .2s;
      box-shadow: 0 2px 7px rgba(0,0,0,.32);
    }

    .toggle.on {
      background: var(--gold-dark);
    }

    .toggle.on::after {
      left: 25px;
      background: #f3e9d5;
    }

    .timeline {
      position: relative;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 11px;
      bottom: 11px;
      left: 88px;
      width: 1px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      min-height: 66px;
      padding: 9px 8px 9px 108px;
      border-radius: 13px;
      transition: .18s ease;
    }

    .timeline-item + .timeline-item {
      margin-top: 2px;
    }

    .timeline-item.current {
      background: rgba(183,149,92,.075);
      box-shadow: inset 0 0 0 1px rgba(183,149,92,.13);
    }

    .timeline-item.complete {
      opacity: .62;
    }

    .timeline-time {
      position: absolute;
      left: 0;
      top: 12px;
      width: 74px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .timeline-dot {
      position: absolute;
      left: 83px;
      top: 17px;
      width: 11px;
      height: 11px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: #48535e;
      box-shadow: 0 0 0 1px var(--border);
    }

    .timeline-item.current .timeline-dot {
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(183,149,92,.12);
    }

    .timeline-item.complete .timeline-dot {
      background: var(--green);
    }

    .timeline-main {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .timeline-copy {
      min-width: 0;
      flex: 1;
    }

    .timeline-title {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
    }

    .timeline-detail {
      max-width: 690px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .timeline-tags {
      margin-top: 7px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .check-btn {
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(255,255,255,.02);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: .15s;
    }

    .check-btn:hover {
      border-color: var(--border-strong);
    }

    .check-btn.done {
      color: #dff1e5;
      border-color: rgba(121,169,139,.32);
      background: rgba(121,169,139,.14);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 10px;
    }

    .metric {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255,255,255,.018);
    }

    .metric label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .metric input,
    .metric select {
      width: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-family: var(--serif);
      font-size: 22px;
    }

    .metric small {
      display: block;
      margin-top: 3px;
      color: var(--muted-2);
      font-size: 10px;
    }

    .field {
      margin-top: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="url"],
    input[type="number"],
    textarea,
    select.standard {
      width: 100%;
      padding: 11px 12px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: rgba(0,0,0,.16);
      transition: border-color .15s;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(183,149,92,.48);
    }

    .btn {
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      background: var(--surface-2);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: .15s ease;
    }

    .btn:hover {
      border-color: rgba(183,149,92,.35);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-gold {
      color: #17130c;
      border-color: var(--gold);
      background: var(--gold-light);
    }

    .btn-quiet {
      background: transparent;
    }

    .btn-danger {
      color: #e5b1aa;
      border-color: rgba(184,120,111,.25);
      background: rgba(184,120,111,.07);
    }

    .button-row {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .week-days {
      display: grid;
      grid-template-columns: repeat(7,1fr);
      gap: 8px;
    }

    .day-score {
      min-height: 116px;
      padding: 12px 9px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      text-align: center;
    }

    .day-score.today {
      border-color: var(--border-strong);
      background:
        linear-gradient(rgba(183,149,92,.055),rgba(183,149,92,.025)),
        var(--surface);
    }

    .day-abbr {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .day-num {
      margin-top: 3px;
      font-family: var(--serif);
      font-size: 21px;
    }

    .score-value {
      margin-top: 13px;
      font-family: var(--serif);
      color: var(--gold-light);
      font-size: 18px;
    }

    .mini-bar {
      height: 4px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.06);
    }

    .mini-bar > div {
      height: 100%;
      border-radius: inherit;
      background: var(--gold);
    }

    .target-list {
      display: grid;
      gap: 9px;
    }

    .target-row {
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.018);
    }

    .target-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .target-name {
      font-weight: 650;
    }

    .target-value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .target-bar {
      height: 5px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255,255,255,.06);
    }

    .target-bar > div {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(to right,var(--gold-dark),var(--gold-light));
    }

    .stat-number {
      font-family: var(--serif);
      font-size: 30px;
      line-height: 1;
    }

    .stat-label {
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .book-hero {
      padding: 21px;
    }

    .book-title {
      margin: 6px 0 4px;
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 500;
      line-height: 1.15;
    }

    .book-author {
      color: var(--gold-light);
      font-size: 12px;
    }

    .book-why {
      max-width: 720px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .book-list {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 10px;
    }

    .book-card {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    .book-card.completed {
      opacity: .57;
    }

    .book-card-title {
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.25;
    }

    .book-card-author {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .book-card-why {
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .book-card-actions {
      margin-top: 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filters {
      margin: 0 0 12px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .filter.active {
      color: var(--gold-light);
      border-color: var(--border-strong);
      background: rgba(183,149,92,.08);
    }

    .prescription {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 9px;
      margin-top: 13px;
    }

    .prescription-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.018);
    }

    .prescription-label {
      color: var(--gold-light);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

/* ------------------------------------------------------------
   UTILITIES
------------------------------------------------------------ */

function slug(value) {
  return String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"")
    .slice(0,40);
}

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function loadState() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!stored) return clone(DEFAULT_STATE);

    return {
      ...clone(DEFAULT_STATE),
      ...stored,
      library: {
        ...clone(DEFAULT_STATE.library),
        ...(stored.library || {})
      },
      settings: {
        ...clone(DEFAULT_STATE.settings),
        ...(stored.settings || {})
      },
      gpts:
        Array.isArray(stored.gpts) && stored.gpts.length
          ? stored.gpts
          : clone(DEFAULT_GPTS)
    };
  } catch (error) {
    return clone(DEFAULT_STATE);
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value) {
  return escapeHTML(value);
}

function pad(n) {
  return String(n).padStart(2,"0");
}

function dateKey(date = new Date()) {
  return (
    date.getFullYear() + "-" +
    pad(date.getMonth() + 1) + "-" +
    pad(date.getDate())
  );
}

function parseDateKey(key) {
  const [y,m,d] = key.split("-").map(Number);
  return new Date(y,m - 1,d,12,0,0,0);
}

function addDays(date, amount) {
  const d = new Date(date);
  d.setDate(d.getDate() + amount);
  return d;
}

function startOfWeek(date = new Date()) {
  const d = new Date(date);
  d.setHours(12,0,0,0);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}

function weekDates(date = new Date()) {
  const start = startOfWeek(date);
  return Array.from({length:7},(_,i) => addDays(start,i));
}

function weekKey(date = new Date()) {
  return dateKey(startOfWeek(date));
}

function isToday(date) {
  return dateKey(date) === dateKey(new Date());
}

function isFutureDate(date) {
  const a = new Date(date);
  a.setHours(0,0,0,0);

  const b = new Date();
  b.setHours(0,0,0,0);

  return a > b;
}

function toMin(time) {
  const [h,m] = time.split(":").map(Number);
  return h * 60 + m;
}

function currentMinute() {
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes();
}

function duration(item) {
  return Math.max(0,toMin(item.end) - toMin(item.start));
}

function prettyTime(time) {
  let [h,m] = time.split(":").map(Number);

  if (h === 24) return "Midnight";

  const suffix = h >= 12 ? "PM" : "AM";
  const hour = h % 12 || 12;

  return hour + (m ? ":" + pad(m) : "") + " " + suffix;
}

function formatDate(date = new Date()) {
  return new Intl.DateTimeFormat("en-US", {
    weekday: "long",
    month: "long",
    day: "numeric"
  }).format(date);
}

function formatShortDate(date) {
  return new Intl.DateTimeFormat("en-US", {
    month: "short",
    day: "numeric"
  }).format(date);
}

function timeNow() {
  return new Intl.DateTimeFormat("en-US", {
    hour: "numeric",
    minute: "2-digit"
  }).format(new Date());
}

function clamp(value,min,max) {
  return Math.min(max,Math.max(min,value));
}

function pct(value,target) {
  if (!target) return 0;
  return clamp(Math.round((value / target) * 100),0,100);
}

function completionKey(date,item) {
  return dateKey(date) + "|" + item.id;
}

function isComplete(date,item) {
  return !!state.completions[completionKey(date,item)];
}

function toggleComplete(dayKey,itemId) {
  const key = dayKey + "|" + itemId;

  if (state.completions[key]) {
    delete state.completions[key];
  } else {
    state.completions[key] = true;
  }

  saveState();
  render();
}

function bookById(id) {
  return BOOKS.find(book => book.id === id);
}

function isBookComplete(id) {
  return state.library.completed.includes(id);
}

function activeBook() {
  let book = bookById(state.library.active);

  if (!book) {
    book = BOOKS.find(b => !isBookComplete(b.id)) || BOOKS[0];
    state.library.active = book.id;
    saveState();
  }

  return book;
}

function firstUnread(categories = null) {
  const matches = BOOKS.filter(book =>
    !isBookComplete(book.id) &&
    (!categories || categories.includes(book.category))
  );

  if (matches.length) return matches[0];

  const fallback = BOOKS.filter(book =>
    !categories || categories.includes(book.category)
  );

  return fallback[0] || BOOKS[0];
}

function categoryColor(category) {
  const map = {
    faith: "#b7955c",
    training: "#79a98b",
    health: "#79a98b",
    recovery: "#6f91ad",
    history: "#b7955c",
    writing: "#8e82aa",
    leadership: "#8e82aa",
    reading: "#b7955c",
    relationship: "#6f91ad",
    skill: "#79a98b",
    review: "#b7955c",
    admin: "#727d87",
    work: "#727d87",
    discipline: "#b7955c",
    commute: "#56616b",
    sleep: "#536778"
  };

  return map[category] || "#727d87";
}

------------------------------------------------------------ */

function skillRotationFor(date) {
  const start = new Date(date.getFullYear(),0,1);
  const days = Math.floor((date - start) / 86400000);
  const week = Math.floor((days + start.getDay()) / 7);

  const rotation = [
    {
      title: "Financial Stewardship",
      text: "Read " +
        firstUnread(["Finance"]).title +
        " and review one concrete financial decision, account, expense, or investing principle."
    },
    {
      title: "Teaching Craft",
      text: "Read " +
        firstUnread(["Writing & Teaching"]).title +
        " and convert one principle into a teaching practice you can actually use."
    },
    {
      title: "Cooking + Hospitality",
      text: "Practice one foundational technique and prepare something you could confidently serve to other people."
    },
    {
      title: "Practical Competence",
      text: "Learn or practice a home, maintenance, organizational, or craftsmanship skill that increases self-reliance."
    }
  ];

  return rotation[week % rotation.length];
}

function hydrateItem(item,date) {
  const x = {...item};
  const active = activeBook();

  if (x.dynamic === "activeBook") {
    x.detail =
      "Read " + active.title + " by " + active.author +
      ". End by writing one sentence stating the author's most important claim from today's reading.";
  }

  if (x.dynamic === "historyBook") {
    const book = firstUnread(["History","Military History"]);

    x.detail =
      "Current study recommendation: " + book.title + " by " + book.author +
      ". Capture three claims, one question, and one primary-source or research lead.";
  }

  if (x.dynamic === "philosophyBook") {
    const book = firstUnread(["Philosophy","Self-Mastery"]);

    x.detail =
      "Recommended: " + book.title + " by " + book.author +
      ". Read slowly. Record one principle worth applying and one point you disagree with or need to examine.";
  }

  if (x.dynamic === "leadershipBook") {
    const book = firstUnread(["Leadership","Military History"]);

    x.detail =
      "Recommended professional study: " + book.title + " by " + book.author +
      ". Ask: what should a leader do differently because this is true?";
  }

  if (x.dynamic === "writingBook") {
    const guide = firstUnread(["Writing & Teaching"]);

    x.detail =
      "Produce at least 400 deliberate words. Use " + guide.title + " by " +
      guide.author +
      " as your current craft companion. Prefer clear argument over impressive language.";
  }

  if (x.dynamic === "skillRotation") {
    const rotation = skillRotationFor(date);
    x.title = rotation.title;
    x.detail = rotation.text;
  }

  if (x.dynamic === "bonusDeep") {
    const history = firstUnread(["History","Military History"]);

    x.detail =
      "Protect this found time. First choice: continue " +
      history.title +
      " with notes. If a Wednesday writing piece is unfinished, finish that before beginning something new.";
  }

  return x;
}


/* ------------------------------------------------------------
   SCHEDULE RETRIEVAL
------------------------------------------------------------ */

function scheduleFor(date = new Date()) {
  const day = date.getDay();
  const early = !!state.earlyRelease[dateKey(date)];

  return SCHEDULES[day]
    .filter(item => {
      if (item.mode === "both") return true;
      if (item.mode === "early") return early;
      if (item.mode === "normal") return !early;
      return true;
    })
    .map(item => hydrateItem(item,date));
}

function trackableFor(date) {
  return scheduleFor(date).filter(item => item.track);
}

function completedCount(date) {
  return trackableFor(date).filter(item => isComplete(date,item)).length;
}

function completionPercent(date) {
  const items = trackableFor(date);
  if (!items.length) return 0;
  return Math.round((completedCount(date) / items.length) * 100);
}

function currentScheduleItem(date = new Date()) {
  if (!isToday(date)) return null;

  const min = currentMinute();

  return scheduleFor(date).find(item =>
    min >= toMin(item.start) &&
    min < toMin(item.end)
  );
}

function nextScheduleItem(date = new Date()) {
  if (!isToday(date)) return null;

  const min = currentMinute();
  return scheduleFor(date).find(item => toMin(item.start) > min);
}


/* ------------------------------------------------------------
   DAILY RECOMMENDATION ENGINE
------------------------------------------------------------ */

function recommendationFor(date = new Date()) {
  const schedule = scheduleFor(date);
  const key = dateKey(date);
  const metrics = state.metrics[key] || {};
  const active = activeBook();
  const now = isToday(date) ? currentMinute() : 12 * 60;

  if (
    metrics.sleep !== undefined &&
    metrics.sleep !== "" &&
    Number(metrics.sleep) < 7.5
  ) {
    return {
      label: "Recovery",
      title: "You are carrying sleep debt. Do not compound it tonight.",
      copy:
        "Keep the day's important commitments, but avoid adding optional work late into the evening. " +
        "Protect bedtime. Eight hours is part of the plan, not what remains after the plan."
    };
  }

  const current = currentScheduleItem(date);

  if (current && current.track && !isComplete(date,current)) {
    return {
      label: "Current Mission",
      title: current.title,
      copy:
        current.detail +
        " Your next responsibility is the block already in front of you. Finish it before looking for another system."
    };
  }

  const missed = schedule.filter(item =>
    item.track &&
    !isComplete(date,item) &&
    toMin(item.end) <= now
  );

  const missedFaith = missed.find(item => item.category === "faith");
  if (missedFaith) {
    return {
      label: "Recover the Anchor",
      title: "Restore the faith block before adding more productivity.",
      copy:
        "You missed " + missedFaith.title +
        ". Protect a short deliberate period for prayer and Scripture rather than pretending the omission did not matter."
    };
  }

  const missedTraining = missed.find(item => item.category === "training");
  if (missedTraining && now < 20 * 60) {
    return {
      label: "Recover the Standard",
      title: "Training was missed. Recover it without wrecking bedtime.",
      copy:
        "Use a shortened, focused version of " + missedTraining.title +
        " if the evening permits. Do not let one missed morning become permission to abandon the week."
    };
  }

  if (
    state.earlyRelease[key] &&
    date.getDay() >= 1 &&
    date.getDay() <= 5 &&
    now >= 15 * 60 &&
    now < 17 * 60
  ) {
    return {
      label: "Found Time",
      title: "Do not spend the 3 PM release like accidental leisure.",
      copy:
        "Use the bonus deep-work block on serious scholarship or writing. Current history recommendation: " +
        firstUnread(["History","Military History"]).title + "."
    };
  }

  const next = schedule.find(item =>
    item.track &&
    !isComplete(date,item) &&
    toMin(item.start) >= now
  );

  if (next) {
    return {
      label: "Next",
      title: "Prepare for " + next.title + ".",
      copy:
        next.detail +
        " Remove friction now so the block begins on time."
    };
  }

  const percentage = completionPercent(date);

  if (percentage >= 80) {
    return {
      label: "Close the Day",
      title: "The important work is largely done. Finish quietly.",
      copy:
        "Do not manufacture more work to feel productive. Restore order, be present with people, pray, and protect sleep."
    };
  }

  return {
    label: "Return to the Rule",
    title: "Do the next unfinished commitment.",
    copy:
      "Do not redesign the schedule because the day became imperfect. Resume at the next meaningful block. " +
      "Your active book remains " + active.title + "."
  };
}


/* ------------------------------------------------------------
   WEEKLY STATISTICS
------------------------------------------------------------ */

function weekStats(reference = new Date()) {
  const dates = weekDates(reference);
  const today = new Date();

  let completed = 0;
  let total = 0;
  let readingMinutes = 0;
  let historyMinutes = 0;
  let training = 0;
  let faithDays = 0;
  let relationshipSessions = 0;
  let writingSessions = 0;
  let weeklyReview = 0;

  const sleepValues = [];

  dates.forEach(date => {
    if (isFutureDate(date)) return;

    const items = trackableFor(date);
    total += items.length;

    let faithOnDay = false;

    items.forEach(item => {
      if (!isComplete(date,item)) return;

      completed++;

      if (item.category === "reading") {
        readingMinutes += duration(item);
      }

      if (item.category === "history") {
        historyMinutes += duration(item);
      }

      if (item.category === "training") {
        training++;
      }

      if (item.category === "faith") {
        faithOnDay = true;
      }

      if (item.category === "relationship") {
        relationshipSessions++;
      }

      if (item.category === "writing") {
        writingSessions++;
      }

      if (item.category === "review") {
        weeklyReview++;
      }
    });

    if (faithOnDay) faithDays++;

    const metrics = state.metrics[dateKey(date)] || {};
    const sleep = Number(metrics.sleep);

    if (sleep > 0) sleepValues.push(sleep);
  });

  const averageSleep = sleepValues.length
    ? sleepValues.reduce((a,b) => a + b,0) / sleepValues.length
    : 0;

  return {
    completed,
    total,
    adherence: total ? Math.round((completed / total) * 100) : 0,
    readingMinutes,
    historyMinutes,
    training,
    faithDays,
    relationshipSessions,
    writingSessions,
    weeklyReview,
    averageSleep,
    sleepDays: sleepValues.length
  };
}

function currentStreak() {
  let cursor = new Date();

  if (currentMinute() < 20 * 60) {
    cursor = addDays(cursor,-1);
  }

  let streak = 0;

  for (let i = 0; i < 120; i++) {
    if (completionPercent(cursor) >= 80) {
      streak++;
      cursor = addDays(cursor,-1);
    } else {
      break;
    }
  }

  return streak;
}

        ${visible.map((book,index) => renderBookCard(book,index)).join("")}
      </div>
    </section>
  `;
}

function renderBookCard(book) {
  const complete = isBookComplete(book.id);
  const active = state.library.active === book.id;
  const pages = Number(state.library.pages[book.id] || 0);

  return `
    <article class="book-card ${complete ? "completed" : ""}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
        <div>
          <div class="book-card-title">
            ${complete ? "✓ " : ""}${escapeHTML(book.title)}
          </div>
          <div class="book-card-author">${escapeHTML(book.author)}</div>
        </div>

        <span class="pill ${active ? "pill-gold" : ""}">
          ${active ? "Current" : escapeHTML(book.category)}
        </span>
      </div>

      <div class="book-card-why">${escapeHTML(book.why)}</div>

      ${
        pages
          ? `<div style="color:var(--muted-2);font-size:10px;margin-top:8px;">
               Logged: ${pages} pages
             </div>`
          : ""
      }

      <div class="book-card-actions">
        ${
          !active && !complete
            ? `<button class="btn" onclick="setActiveBook('${book.id}')">Set Current</button>`
            : ""
        }

        <button class="btn ${complete ? "btn-quiet" : ""}" onclick="toggleBookComplete('${book.id}')">
          ${complete ? "Mark Unfinished" : "Mark Complete"}
        </button>
      </div>
    </article>
  `;
}

function setBookFilter(category) {
  bookFilter = category;
  render();
}

function setActiveBook(id) {
  state.library.active = id;

  if (isBookComplete(id)) {
    state.library.completed =
      state.library.completed.filter(bookId => bookId !== id);
  }

  saveState();
  toast("Current book updated.");
  render();
}

function toggleBookComplete(id) {
  const index = state.library.completed.indexOf(id);

  if (index >= 0) {
    state.library.completed.splice(index,1);
    state.library.active = id;
  } else {
    state.library.completed.push(id);

    if (state.library.active === id) {
      const next = BOOKS.find(book => !state.library.completed.includes(book.id));
      if (next) state.library.active = next.id;
    }
  }

  saveState();
  render();
}

function setBookPages(id,value) {
  const pages = Math.max(0,Number(value) || 0);
  state.library.pages[id] = pages;
  saveState();
}

function buildLifeContext() {
  const today = new Date();
  const key = dateKey(today);

  const stats = weekStats(today);

  const book = activeBook();

  const completed = schedule
    .filter(item => item.track && isComplete(today,item))
    .map(item => item.title);

  const unfinished = schedule
    .filter(item => item.track && !isComplete(today,item))
    .map(item => item.title);

  const current = currentScheduleItem(today);
  const next = nextScheduleItem(today);
  const review = state.reviews[weekKey(today)] || {};

  return [
    "ORDO LIFE CONTEXT",
    "",
    "Person: " + (state.settings.name || "Daniel"),
    "Date: " + formatDate(today),
    "Current local time: " + timeNow(),
    "Today's theme: " + DAY_THEMES[today.getDay()].title,
    "Values, in order: " + VALUES,
    "",
    "NON-NEGOTIABLE STRUCTURE",
    "- Work: Monday-Friday, 9:00 AM-5:00 PM",
    "- Commute: approximately 15 minutes",
    "- Sleep target: 8 hours nightly",
    "- Weeknight bedtime: 9:45 PM",
    "- Friday/Saturday bedtime: 10:30 PM",
    "- Training emphasizes strength, athleticism, conditioning, mobility, recovery, and longevity.",
    "- Intellectual focus: American history, military history, philosophy, leadership, nonfiction, writing, teaching, and self-development.",
    "- Fiction is not part of the current reading curriculum.",
    "",
    "TODAY",
    "Early release at 3 PM: " + (state.earlyRelease[key] ? "Yes" : "No"),
    "Current block: " + (current ? current.title : "None"),
    "Next block: " + (next ? next.title + " at " + prettyTime(next.start) : "None"),
    "Tracked commitments complete: " + completedCount(today) + "/" + trackableFor(today).length,
    "Daily adherence so far: " + completionPercent(today) + "%",
    "Completed: " + (completed.length ? completed.join("; ") : "None logged"),
    "Unfinished: " + (unfinished.length ? unfinished.join("; ") : "None"),
    "",
    "HEALTH DATA",
    "Sleep last night: " + (metrics.sleep ? metrics.sleep + " hours" : "Not logged"),
    "Screen time: " + (metrics.screen ? metrics.screen + " minutes" : "Not logged"),
    "Energy: " + (metrics.energy ? metrics.energy + "/5" : "Not logged"),
    "",
    "READING",
    "Current book: " + book.title + " — " + book.author,
    "Approximate pages logged: " + (state.library.pages[book.id] || 0),
    "Books completed in ORDO: " + state.library.completed.length + "/" + BOOKS.length,
    "Next history recommendation: " + firstUnread(["History","Military History"]).title,
    "Next philosophy/self-mastery recommendation: " + firstUnread(["Philosophy","Self-Mastery"]).title,
    "",
    "THIS WEEK",
    "Overall adherence: " + stats.adherence + "%",
    "Faith days: " + stats.faithDays + "/7",
    "Training sessions: " + stats.training + "/5",
    "Reading: " + formatMinutes(stats.readingMinutes) + "/5 hours",
    "History scholarship: " + formatMinutes(stats.historyMinutes) + "/3 hours",
    "Writing sessions: " + stats.writingSessions,
    "Relationship blocks: " + stats.relationshipSessions,
    "Average sleep: " + (stats.sleepDays ? stats.averageSleep.toFixed(1) + " hours" : "Not enough data"),
    "",
    "CURRENT WEEKLY REFLECTION",
    "What was faithful: " + (review.wins || "Not written"),
    "Where I drifted: " + (review.drift || "Not written"),
    "Who received my best: " + (review.people || "Not written"),
    "Lesson learned: " + (review.lesson || "Not written"),
    "What should stop: " + (review.stop || "Not written"),
    "Next week's priority: " + (review.next || "Not written")

}

function buildPrompt(type) {
  const context = buildLifeContext();

  const tasks = {
    day:
`Audit the remainder of my day against my stated priorities.

Do not give me a long list of productivity ideas.
Identify:
1. The most important thing I should do next.
2. Anything I should deliberately let go today.
3. One risk to my discipline or relationships.
4. What a successful close to the day looks like.

Protect faith, relationships, health, duty, and sleep before optional productivity.`,

    week:
`Conduct a rigorous weekly life audit.

Compare my behavior with my stated priorities rather than accepting my intentions at face value.

Identify:
1. What I did well and should preserve.
2. Where my calendar exposed a mismatch between values and behavior.
3. The largest source of wasted time or attention.
4. Whether I neglected faith, relationships, health, leadership, scholarship, or recovery.
5. One thing to eliminate or reduce.
6. One thing to protect more strongly next week.
7. The single highest-leverage adjustment for the coming week.

Do not redesign the entire system unless the evidence shows the system itself is failing.`,

    reading:
`Act as my serious nonfiction reading adviser.

I am currently prioritizing American history, military history, philosophy, leadership, biography, teaching, writing, financial literacy, and self-mastery. I am not interested in fiction right now.

Using my current book and reading history:
1. Tell me whether I should continue the current book or change course.
2. Give me three questions to carry into today's reading.
3. Tell me what I should write in my notes when I finish.
4. Identify the logical next book only if that is useful.
5. Connect the reading to leadership, character, teaching, or historical understanding.

Favor primary sources and foundational books over trendy self-help.`,

    training:
`Review my week from the perspective of sustainable physical excellence.

Prioritize strength, athleticism, useful endurance, mobility, recovery, sleep, and longevity.

Using the schedule and completion data:
1. Identify any training imbalance.
2. Tell me what today's physical priority should be.
3. Protect recovery if sleep is inadequate.
4. Distinguish between useful discipline and unnecessary fatigue.
5. Recommend the next action, not an entirely new program.`,

    leadership:
`Review my current week as a leader.

Evaluate whether I am becoming more trustworthy, competent, disciplined, humble, and useful to other people.

Focus on:
1. Duty and professional competence.
2. Developing other people.
3. Preparation.
4. Integrity between stated standards and personal behavior.
5. Emotional maturity.
6. Where I need to listen, teach, correct, or take responsibility.

Give me one concrete leadership action to take within the next seven days.`,

    decision:
`Help me make a decision according to long-term principles.

Use this sequence:
1. Identify the real problem.
2. Identify hidden assumptions.
3. Explain the tradeoffs.
4. Distinguish short-term comfort from long-term value.
5. Recommend the strongest option.
6. Explain the ten-year consequence.
7. Give me the first action to take.

Judge the decision against faith, family, integrity, service, discipline, health, wisdom, leadership, financial freedom, and legacy.`
  };

  return context + "\n\nTASK FOR YOU\n" + tasks[type];
}

    gpt.url && /^https?:\/\//i.test(gpt.url)
      ? gpt.url
      : "https://chatgpt.com/";

  window.open(url,"_blank","noopener,noreferrer");
  copyText(prompt);

  toast(
    "ORDO brief copied. Paste it into " +
    (gpt.name || "ChatGPT") +
    "."

}

function copyTextFromApp(text) {
  copyText(text);

}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const area = document.createElement("textarea");
  area.value = text;
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.focus();
  area.select();

  try {
    document.execCommand("copy");
  } catch (error) {}

  area.remove();
}

  state.settings.name =

      ? name.value.trim()

  state.gpts.forEach(gpt => {
    const nameInput =
      document.getElementById("gpt-name-" + gpt.id);

    const urlInput =
      document.getElementById("gpt-url-" + gpt.id);

    if (nameInput && nameInput.value.trim()) {
      gpt.name = nameInput.value.trim();

    if (urlInput) {

    }
  });

  saveState();
  closeModal();

/* ------------------------------------------------------------
   BACKUP / IMPORT / RESET
------------------------------------------------------------ */

function exportData() {
  const payload = {
    app: "ORDO — A Rule of Life",
    exportedAt: new Date().toISOString(),
    data: state
  };

  const blob = new Blob(
    [JSON.stringify(payload,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "ordo-backup-" + dateKey() + ".json";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url),1000);
  toast("ORDO backup exported.");
}

function importData(file) {
  if (!file) return;

  const reader = new FileReader();

  reader.onload = event => {
    try {
      const parsed = JSON.parse(event.target.result);
      const incoming = parsed.data || parsed;

      if (!incoming || typeof incoming !== "object") {
        throw new Error("Invalid backup");
      }

      state = {
        ...clone(DEFAULT_STATE),
        ...incoming,
        library: {
          ...clone(DEFAULT_STATE.library),
          ...(incoming.library || {})
        },
        settings: {
          ...clone(DEFAULT_STATE.settings),
          ...(incoming.settings || {})
        },
        gpts:
          Array.isArray(incoming.gpts) && incoming.gpts.length
            ? incoming.gpts
            : clone(DEFAULT_GPTS)
      };

      saveState();
      closeModal();
      render();
      toast("ORDO backup restored.");
    } catch (error) {
      alert("That file does not appear to be a valid ORDO backup.");
    }
  };

  reader.readAsText(file);
}

function resetApp() {
  const confirmed = confirm(
    "Reset ORDO on this device? This permanently removes local progress unless you exported a backup."
  );

  if (!confirmed) return;

  localStorage.removeItem(STORAGE_KEY);
  state = clone(DEFAULT_STATE);

  closeModal();
  render();
  toast("ORDO reset.");
}

}

/*
  Build a lightweight manifest dynamically so the single-file
  application can present itself cleanly when supported.
*/
(function createManifest() {
  try {
    const iconSvg =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <rect width="512" height="512" rx="96" fill="#0c1116"/>
        <circle cx="256" cy="256" r="158" fill="none" stroke="#b7955c" stroke-width="24"/>
        <path d="M256 112v288M112 256h288" stroke="#b7955c" stroke-width="14" opacity=".42"/>
        <circle cx="256" cy="256" r="38" fill="#b7955c"/>
      </svg>`;

    const iconData =
      "data:image/svg+xml;charset=utf-8," +
      encodeURIComponent(iconSvg);

    const manifest = {
      name: "ORDO — A Rule of Life",
      short_name: "ORDO",
      start_url: ".",
      display: "standalone",
      background_color: "#0c1116",
      theme_color: "#0c1116",
      description:
        "A personal rule of life for faith, discipline, health, scholarship, leadership, relationships, and legacy.",
      icons: [
        {
          src: iconData,
          sizes: "512x512",
          type: "image/svg+xml",
          purpose: "any maskable"
        }
      ]
    };

    const blob = new Blob(
      [JSON.stringify(manifest)],
      {type:"application/manifest+json"}
    );

    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(blob);

    document.head.appendChild(link);
  } catch (error) {}
})();

render();

clockTimer = setInterval(updateClock,30000);

document.addEventListener("visibilitychange",() => {
  if (!document.hidden) {
    render();
  }
});
